<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="760" viewBox="0 0 1900 760" role="img" aria-labelledby="title desc">
  <title id="title">Experiment 11 Model Pipeline</title>
  <desc id="desc">A paper-style visual pipeline for Experiment 11: no-overlap semantic tag preprocessing, aligned multi-view dataset construction, multi-view fusion model, label graph refinement, and evaluation.</desc>
  <defs>
    <style>
      .stage { font: 500 32px Arial, Helvetica, sans-serif; fill: #000; }
      .label { font: 700 25px Arial, Helvetica, sans-serif; fill: #000; }
      .mid { font: 600 22px Arial, Helvetica, sans-serif; fill: #000; }
      .small { font: 500 19px Arial, Helvetica, sans-serif; fill: #000; }
      .tiny { font: 500 16px Arial, Helvetica, sans-serif; fill: #1b1b1b; }
      .note { font: 500 18px Arial, Helvetica, sans-serif; fill: #333; }
      .group { fill: none; stroke: #1d3354; stroke-width: 3; stroke-dasharray: 8 6; rx: 22; }
      .solid { fill: #fff; stroke: #111; stroke-width: 3; rx: 2; }
      .module { fill: #d8efc3; stroke: none; rx: 14; }
      .soft-green { fill: #e8f6dc; stroke: #5a8d42; stroke-width: 2; rx: 4; }
      .soft-blue { fill: #c8ddef; stroke: #386d9c; stroke-width: 2; rx: 4; }
      .soft-red { fill: #f3cbd0; stroke: #a24a55; stroke-width: 2; rx: 4; }
      .soft-orange { fill: #f6e0cf; stroke: none; rx: 14; }
      .blue-arrow { fill: none; stroke: #0071bc; stroke-width: 4; marker-end: url(#blueArrow); }
      .red-arrow { fill: none; stroke: #cf0000; stroke-width: 4; marker-end: url(#redArrow); }
      .orange-arrow { fill: none; stroke: #ee7823; stroke-width: 4; marker-end: url(#orangeArrow); }
      .black-line { stroke: #000; stroke-width: 3; fill: none; marker-start: url(#blackArrowStart); marker-end: url(#blackArrow); }
      .thin-black { stroke: #000; stroke-width: 2.5; fill: none; }
      .dash-sep { stroke: #4b5568; stroke-width: 3; stroke-dasharray: 16 12; }
    </style>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0071bc"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#cf0000"/>
    </marker>
    <marker id="orangeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ee7823"/>
    </marker>
    <marker id="blackArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#000"/>
    </marker>
    <marker id="blackArrowStart" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M10,0 L0,5 L10,10 Z" fill="#000"/>
    </marker>
  </defs>

  <rect width="1900" height="760" fill="#fff"/>

  <!-- Stage brackets -->
  <path class="black-line" d="M30 38 L390 38"/>
  <text class="stage" x="103" y="31">Preprocessing</text>
  <line class="thin-black" x1="30" y1="18" x2="30" y2="58"/>
  <line class="thin-black" x1="390" y1="18" x2="390" y2="58"/>

  <path class="black-line" d="M430 38 L840 38"/>
  <text class="stage" x="512" y="31">No-leak alignment</text>
  <line class="thin-black" x1="430" y1="18" x2="430" y2="58"/>
  <line class="thin-black" x1="840" y1="18" x2="840" y2="58"/>

  <path class="black-line" d="M865 38 L1395 38"/>
  <text class="stage" x="1018" y="31">Multi-view fusion</text>
  <line class="thin-black" x1="865" y1="18" x2="865" y2="58"/>
  <line class="thin-black" x1="1395" y1="18" x2="1395" y2="58"/>

  <path class="black-line" d="M1420 38 L1870 38"/>
  <text class="stage" x="1535" y="31">Refinement &amp; output</text>
  <line class="thin-black" x1="1420" y1="18" x2="1420" y2="58"/>
  <line class="thin-black" x1="1870" y1="18" x2="1870" y2="58"/>

  <!-- Groups -->
  <rect class="group" x="30" y="70" width="370" height="590"/>
  <rect class="group" x="430" y="70" width="410" height="590"/>
  <rect class="group" x="865" y="70" width="530" height="590"/>
  <rect class="group" x="1420" y="70" width="450" height="590"/>

  <!-- Preprocessing -->
  <rect class="solid" x="95" y="95" width="250" height="126"/>
  <rect fill="#f5f5f5" stroke="#666" stroke-width="3" x="110" y="112" width="220" height="43"/>
  <text class="mid" x="137" y="141">1K Tag Matrix</text>
  <rect fill="#f5f5f5" stroke="#666" stroke-width="3" x="110" y="165" width="220" height="43"/>
  <text class="mid" x="141" y="194">81 Label Set</text>

  <rect class="module" x="72" y="246" width="302" height="74"/>
  <text class="label" x="92" y="292">Find overlap labels</text>
  <text class="tiny" x="132" y="315">75 shared names</text>

  <rect class="soft-red" x="196" y="365" width="128" height="112"/>
  <line x1="196" y1="405" x2="324" y2="405" stroke="#333" stroke-width="3"/>
  <line x1="196" y1="441" x2="324" y2="441" stroke="#333" stroke-width="3"/>
  <text class="small" x="169" y="520">Remove 75 tags</text>
  <text class="tiny" x="192" y="544">sky, water, cat...</text>

  <rect class="soft-green" x="83" y="570" width="270" height="55"/>
  <text class="mid" x="111" y="605">Clean tag view: 925</text>

  <path class="red-arrow" d="M220 221 L220 243"/>
  <path class="red-arrow" d="M223 320 L260 360"/>
  <path class="red-arrow" d="M260 477 L220 565"/>

  <!-- Alignment -->
  <rect class="solid" x="462" y="106" width="138" height="90"/>
  <text class="mid" x="484" y="139">Local</text>
  <text class="small" x="483" y="167">193,734</text>

  <rect class="solid" x="645" y="106" width="138" height="90"/>
  <text class="mid" x="665" y="139">Official</text>
  <text class="small" x="664" y="167">161,789</text>

  <rect class="module" x="500" y="242" width="270" height="85"/>
  <text class="label" x="536" y="276">Match image names</text>
  <text class="tiny" x="562" y="304">basename + lowercase</text>

  <rect class="soft-blue" x="500" y="368" width="270" height="90"/>
  <text class="mid" x="535" y="402">Matched samples</text>
  <text class="small" x="565" y="431">116,127 images</text>

  <rect class="soft-green" x="486" y="545" width="300" height="80"/>
  <text class="mid" x="517" y="578">Aligned clean tags</text>
  <text class="small" x="546" y="607">116,127 x 925</text>

  <path class="red-arrow" d="M600 151 L640 151"/>
  <path class="blue-arrow" d="M531 196 L590 240"/>
  <path class="blue-arrow" d="M714 196 L680 240"/>
  <path class="red-arrow" d="M635 327 L635 364"/>
  <path class="red-arrow" d="M635 458 L635 541"/>
  <path class="blue-arrow" d="M353 598 L482 598"/>

  <!-- Model inputs and fusion -->
  <text class="small" x="885" y="105">Visual feature views</text>
  <rect class="solid" x="885" y="125" width="75" height="48"/>
  <text class="small" x="902" y="156">BoW</text>
  <rect class="solid" x="970" y="125" width="75" height="48"/>
  <text class="small" x="994" y="156">CH</text>
  <rect class="solid" x="1055" y="125" width="75" height="48"/>
  <text class="small" x="1079" y="156">CM</text>
  <rect class="solid" x="1140" y="125" width="90" height="48"/>
  <text class="small" x="1158" y="156">CORR</text>
  <rect class="solid" x="1240" y="125" width="75" height="48"/>
  <text class="small" x="1258" y="156">EDH</text>
  <rect class="solid" x="1325" y="125" width="70" height="48"/>
  <text class="small" x="1344" y="156">WT</text>

  <rect class="soft-green" x="905" y="220" width="435" height="54"/>
  <text class="mid" x="936" y="254">7 views: BoW + 5 global + 925 tags</text>

  <rect class="module" x="930" y="330" width="360" height="80"/>
  <text class="label" x="972" y="365">Per-view encoders</text>
  <text class="tiny" x="966" y="392">BoW 500-&gt;256 | tags 925-&gt;512</text>

  <rect class="solid" x="940" y="455" width="350" height="70"/>
  <circle cx="980" cy="490" r="25" fill="#f3cbd0" stroke="#333" stroke-width="2"/>
  <circle cx="1025" cy="490" r="25" fill="#d8efc3" stroke="#333" stroke-width="2"/>
  <circle cx="1070" cy="490" r="25" fill="#b8d2ee" stroke="#333" stroke-width="2"/>
  <circle cx="1115" cy="490" r="25" fill="#f7e1b7" stroke="#333" stroke-width="2"/>
  <circle cx="1160" cy="490" r="25" fill="#d8d2ef" stroke="#333" stroke-width="2"/>
  <circle cx="1205" cy="490" r="25" fill="#c7e7e0" stroke="#333" stroke-width="2"/>
  <circle cx="1250" cy="490" r="25" fill="#ecd5b7" stroke="#333" stroke-width="2"/>
  <text class="small" x="1005" y="558">Concatenate encoded views</text>

  <rect class="module" x="952" y="580" width="330" height="70"/>
  <text class="label" x="1004" y="615">Fusion MLP + residual</text>
  <text class="tiny" x="1030" y="640">concat dim = 1,536</text>

  <path class="red-arrow" d="M922 174 L1010 218"/>
  <path class="red-arrow" d="M1185 174 L1185 216"/>
  <path class="red-arrow" d="M1360 174 L1240 218"/>
  <path class="red-arrow" d="M786 586 L925 255"/>
  <path class="blue-arrow" d="M1112 274 L1112 326"/>
  <path class="blue-arrow" d="M1112 410 L1112 451"/>
  <path class="blue-arrow" d="M1112 525 L1112 581"/>

  <!-- Output and refinement -->
  <rect class="soft-blue" x="1465" y="125" width="135" height="100"/>
  <text class="mid" x="1499" y="164">81</text>
  <text class="small" x="1488" y="195">logits</text>

  <rect class="solid" x="1640" y="100" width="180" height="150"/>
  <line x1="1662" y1="130" x2="1798" y2="130" stroke="#333" stroke-width="2"/>
  <line x1="1662" y1="160" x2="1798" y2="160" stroke="#333" stroke-width="2"/>
  <line x1="1662" y1="190" x2="1798" y2="190" stroke="#333" stroke-width="2"/>
  <line x1="1662" y1="220" x2="1798" y2="220" stroke="#333" stroke-width="2"/>
  <line x1="1688" y1="115" x2="1688" y2="235" stroke="#333" stroke-width="2"/>
  <line x1="1728" y1="115" x2="1728" y2="235" stroke="#333" stroke-width="2"/>
  <line x1="1768" y1="115" x2="1768" y2="235" stroke="#333" stroke-width="2"/>
  <circle cx="1688" cy="160" r="5" fill="#111"/>
  <circle cx="1728" cy="130" r="5" fill="#111"/>
  <circle cx="1768" cy="220" r="5" fill="#111"/>
  <circle cx="1798" cy="190" r="5" fill="#111"/>
  <circle cx="1662" cy="220" r="5" fill="#111"/>
  <text class="small" x="1604" y="276">Sparse co-occurrence</text>
  <text class="tiny" x="1658" y="303">81 x 81 | density 10.8%</text>

  <rect class="soft-orange" x="1490" y="330" width="330" height="82"/>
  <text class="label" x="1525" y="365">Refine label scores</text>
  <text class="tiny" x="1558" y="391">co-occurrence-aware correction</text>

  <rect class="module" x="1490" y="505" width="330" height="92"/>
  <text class="label" x="1538" y="543">81-label prediction</text>
  <text class="tiny" x="1530" y="573">mAP 0.4830 | Mi-F1 0.6838</text>

  <path class="blue-arrow" d="M1282 615 L1460 174"/>
  <path class="orange-arrow" d="M1600 176 L1635 176"/>
  <path class="orange-arrow" d="M1730 250 L1730 326"/>
  <path class="orange-arrow" d="M1532 225 L1594 326"/>
  <path class="blue-arrow" d="M1655 412 L1655 500"/>

  <!-- Supervision and evaluation notes -->
  <line class="dash-sep" x1="30" y1="690" x2="1870" y2="690"/>
  <text class="note" x="58" y="725">Training split: 104,514 train / 11,613 validation</text>
  <text class="note" x="566" y="725">Loss: BCEWithLogits</text>
  <text class="note" x="850" y="725">BoW: 500-d local semantics</text>
  <text class="note" x="1160" y="725">Graph: sparse-valued dense .npy</text>
  <text class="note" x="1498" y="725">No-overlap avoids direct tag-label leakage</text>
</svg>
